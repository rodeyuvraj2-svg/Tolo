name: Release Tolo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary output
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/tolo.exe")) {
            Write-Error "tolo.exe was not found in target/release!"
            exit 1
          }
          Get-Item "target/release/tolo.exe" | Select-Object Name, Length

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "target/release/tolo.exe", "README.md" -DestinationPath "target/release/tolo-windows-x64.zip"

      - name: Create GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/tolo.exe
            target/release/tolo-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
